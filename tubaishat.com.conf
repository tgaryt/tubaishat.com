# Nginx server block: HTTPS on port 443 with the Cloudflare Origin CA certificate, proxied to the Astro server on 127.0.0.1:4321.
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name tubaishat.com;

	ssl_certificate /etc/ssl/tubaishat.com/origin.pem;
	ssl_certificate_key /etc/ssl/tubaishat.com/origin.key;

	location / {
		proxy_pass http://127.0.0.1:4321;
		proxy_set_header Host $host;
	}
}
